spring.application.name=gateway
server.port=8082


# Eureka client
eureka.client.serviceUrl.defaultZone=${EUREKA_URI:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true


spring.cloud.gateway.server.webmvc.routes[0].id=api-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://api-service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/**

spring.cloud.gateway.server.webmvc.routes[1].id=api-service-swagger-ui
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://api-service
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/swagger-ui.html,/swagger-ui/**

spring.cloud.gateway.server.webmvc.routes[2].id=api-service-openapi
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://api-service
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/v3/api-docs/**

spring.cloud.gateway.server.webmvc.routes[3].id=api-service-webjars
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://api-service
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/webjars/**


management.endpoints.web.exposure.include=health,info